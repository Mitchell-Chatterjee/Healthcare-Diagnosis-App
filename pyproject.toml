[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healthcare-diagnosis-app"
version = "1.0.0"
description = "AI-powered healthcare diagnosis assistance system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Mitchell Chatterjee", email = "mitchell@example.com"},
]
keywords = [
    "healthcare",
    "diagnosis", 
    "ai",
    "medical",
    "agents",
    "agno"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "agno>=0.2.0",
    "pydantic>=2.6.0",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.8.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.22.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.1",
    "redis>=4.7.0",
    "sqlalchemy>=2.1.0",
    "alembic>=1.11.0",
    "psycopg2-binary>=2.9.8",
    "deepeval==3.3.9",
]

[project.optional-dependencies]
dev = [
    "black>=24.3.0",
    "flake8>=6.1.0",
    "mypy>=1.4.0",
    "pre-commit>=3.6.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.22.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "factory-boy>=3.3.0",
    "httpx>=0.24.1",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1.0",
    "mkdocstrings[python]>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/Mitchell-Chatterjee/Healthcare-Diagnosis-App"
Documentation = "https://github.com/Mitchell-Chatterjee/Healthcare-Diagnosis-App/docs"
Repository = "https://github.com/Mitchell-Chatterjee/Healthcare-Diagnosis-App.git"
Issues = "https://github.com/Mitchell-Chatterjee/Healthcare-Diagnosis-App/issues"

[project.scripts]
healthcare-workflow = "backend.src.workflows.healthcare_workflow.__main__:main"
healthcare-demo = "backend.utils.simple_healthcare_workflow_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["backend", "shared"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long (handled by black)
    "W503",  # line break before binary operator
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "agno.*",
    "deepeval.*",
    "agno_test.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
    "backend/src",
    "backend/tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["backend/src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]